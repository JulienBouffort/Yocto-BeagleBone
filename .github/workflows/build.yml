name: Yocto BeagleBone Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # 1. Libérer l'espace disque sur le runner GitHub
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      # 2. Fix AppArmor userns pour Ubuntu 24.04
      - name: Fix AppArmor userns for Yocto
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Yocto dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            gawk wget git diffstat unzip texinfo \
            gcc build-essential chrpath socat cpio \
            python3 python3-pip python3-pexpect \
            python3-git python3-jinja2 python3-subunit \
            xz-utils zstd liblz4-tool lz4 bzip2 gzip tar \
            debianutils iputils-ping file locales \
            libacl1 libgl1 libgl1-mesa-dev libsdl1.2-dev mesa-common-dev \
            curl rsync bc libssl-dev libelf-dev pkg-config
          sudo locale-gen en_US.UTF-8

      - name: Cache sstate
        uses: actions/cache@v4
        with:
          path: sstate-cache
          key: yocto-sstate-beaglebone-${{ hashFiles('sources/meta-ros/**/*.bb', 'build/conf/local.conf') }}
          restore-keys: |
            yocto-sstate-beaglebone-
          save-always: true

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: downloads
          key: yocto-downloads-${{ hashFiles('sources/meta-ros/**/*.bb') }}
          restore-keys: |
            yocto-downloads-
          save-always: true

      - name: Clone repositories
        run: |
          git clone -b scarthgap https://github.com/yoctoproject/poky.git sources/poky
          git clone -b scarthgap https://git.yoctoproject.org/meta-arm.git sources/meta-arm
          git clone -b scarthgap https://git.yoctoproject.org/meta-ti.git sources/meta-ti
          git clone -b scarthgap https://github.com/openembedded/meta-openembedded.git sources/meta-openembedded
          git clone -b scarthgap https://github.com/ros/meta-ros.git sources/meta-ros

      - name: Setup build environment
        run: |
          WORKSPACE="${GITHUB_WORKSPACE}"
          source sources/poky/oe-init-build-env ${WORKSPACE}/build

          cat > ${WORKSPACE}/build/conf/local.conf << EOF
          MACHINE = "beaglebone-yocto"
          DL_DIR = "${WORKSPACE}/downloads"
          SSTATE_DIR = "${WORKSPACE}/sstate-cache"
          BB_NUMBER_THREADS = "4"
          PARALLEL_MAKE = "-j4"
          IMAGE_FSTYPES = "ext4 wic wic.bmap"
          DISTRO = "poky"
          PACKAGE_CLASSES = "package_rpm"
          LICENSE_FLAGS_ACCEPTED = "commercial"
          INHERIT += "rm_work"

          # Configuration CDN & suppression de l'avertissement Hashserve
          BB_HASHSERVE = ""
          SSTATE_MIRRORS = "file://.* https://cdn.yoctoproject.org/sstate/all/PATH;downloadfilename=PATH"

          ROS_DISTRO = "jazzy"
          EXTRA_IMAGE_FEATURES:append = " ros-implicit-workspace"
          IMAGE_INSTALL:append = " \
              python3 \
              python3-pip \
              cmake \
              git \
              wget \
              gcc \
              make \
              ros-core \
              demo-nodes-cpp \
              demo-nodes-py \
              ros2cli \
              ros2launch \
              ros2bag \
              rclcpp \
              rclpy \
              std-msgs \
              geometry-msgs \
              sensor-msgs \
              rmw-cyclonedds-cpp \
          "
          EOF

          cat > ${WORKSPACE}/build/conf/bblayers.conf << EOF
          POKY_BBLAYERS_CONF_VERSION = "2"
          BBPATH = "\${TOPDIR}"
          BBFILES ?= ""
          BBLAYERS ?= " \
            ${WORKSPACE}/sources/poky/meta \
            ${WORKSPACE}/sources/poky/meta-poky \
            ${WORKSPACE}/sources/poky/meta-yocto-bsp \
            ${WORKSPACE}/sources/meta-arm/meta-arm \
            ${WORKSPACE}/sources/meta-arm/meta-arm-toolchain \
            ${WORKSPACE}/sources/meta-openembedded/meta-oe \
            ${WORKSPACE}/sources/meta-openembedded/meta-python \
            ${WORKSPACE}/sources/meta-openembedded/meta-networking \
            ${WORKSPACE}/sources/meta-openembedded/meta-filesystems \
            ${WORKSPACE}/sources/meta-ti/meta-ti-bsp \
            ${WORKSPACE}/sources/meta-ros/meta-ros-common \
            ${WORKSPACE}/sources/meta-ros/meta-ros2 \
            ${WORKSPACE}/sources/meta-ros/meta-ros2-jazzy \
            "
          EOF

      - name: Build core-image-minimal
        run: |
          source sources/poky/oe-init-build-env ${GITHUB_WORKSPACE}/build
          bitbake core-image-minimal
        env:
          LANG: en_US.UTF-8

      - name: Upload image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beaglebone-image
          path: |
            build/tmp/deploy/images/beaglebone-yocto/*.wic
            build/tmp/deploy/images/beaglebone-yocto/*.wic.bmap
            build/tmp/deploy/images/beaglebone-yocto/*.ext4
          retention-days: 7
